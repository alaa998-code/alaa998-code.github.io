<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أذكار">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF9EC">
<meta name="description" content="أذكار الصباح والمساء مع عدّاد لكل ذكر، ويعمل بدون إنترنت.">
<title>أذكار الصباح والمساء</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --fs:26px;
  /* morning (dawn) */
  --bg:#F5F9FB; --bg2:#FFF9EC; --ink:#1E3340; --soft:#6A8191;
  --card:#FFFFFF; --line:#E2EAEE; --accent:#E3A53A; --accentInk:#FFFFFF; --done:#7FA38B;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#2C3E49;--bg2:#3E3D33;--ink:#F6F2E8;--soft:#BCC9D0;--card:#36505E;--line:#4C6673;--accent:#F0B955;--accentInk:#1B2A33;--done:#8DB89A}
}
:root[data-theme="dark"]{--bg:#2C3E49;--bg2:#3E3D33;--ink:#F6F2E8;--soft:#BCC9D0;--card:#36505E;--line:#4C6673;--accent:#F0B955;--accentInk:#1B2A33;--done:#8DB89A}
/* evening (night) — always dark */
body.evening{--bg:#2E3668;--bg2:#453A70;--ink:#F3F1FB;--soft:#C3C0DD;--card:#3A437A;--line:#525C96;--accent:#E9EBFC;--accentInk:#2E3668;--done:#A5BBE6}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif;
  background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 340px) var(--bg);
  background-color:var(--bg);
  color:var(--ink);min-height:100vh;
  transition:background-color .5s,color .5s;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 80px}

/* horizon hero */
.hero{position:relative;padding:18px 0 8px;text-align:center}
.sky{width:100%;max-width:420px;height:auto;display:block;margin:0 auto}
.sky .arc{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:3 6}
.sky .ground{stroke:var(--soft);stroke-width:1.5;opacity:.35}
.sky .orb{fill:var(--accent);transition:cx .6s ease,cy .6s ease}
.sky .glow{fill:var(--accent);opacity:.28;transition:cx .6s ease,cy .6s ease}
.sky .star{fill:var(--accent);opacity:0;transition:opacity .5s}
body.evening .sky .star{opacity:.85}
h1{font-family:"Amiri",serif;font-weight:700;font-size:clamp(34px,9vw,46px);line-height:1.1;margin-top:-6px}
.sub{color:var(--soft);font-size:14px;margin-top:6px}

/* sticky bar */
.bar{position:sticky;top:0;z-index:5;padding:10px 0 12px;background:var(--bg);transition:background-color .5s}
.bar::before{content:"";position:absolute;inset:0 -16px;background:var(--bg);z-index:-1;padding-top:env(safe-area-inset-top,0px);top:calc(-1 * env(safe-area-inset-top,0px))}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{font:inherit;font-size:16px;font-weight:500;border:0;background:none;color:var(--soft);padding:10px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accentInk)}
.prog{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--soft)}
.track{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .4s}
.tools{display:flex;gap:6px}
.tools button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer}

/* azkar list */
.list{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.zikr{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:20px 18px 14px;cursor:pointer;user-select:none;-webkit-user-select:none;
  transition:opacity .35s,transform .12s,border-color .3s;
}
.zikr:active{transform:scale(.985)}
.zikr:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.pre{font-family:"Amiri",serif;color:var(--soft);font-size:calc(var(--fs) * .75);margin-bottom:6px;text-align:center}
.txt{font-family:"Amiri",serif;font-size:var(--fs);line-height:2;text-align:justify;text-align-last:center}
.ref{color:var(--soft);font-size:.7em}
.fadl{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);color:var(--soft);font-size:14px;line-height:1.7;text-align:center}
.foot{display:flex;justify-content:center;margin-top:12px}
.count{
  --p:0;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p)*1turn),var(--line) 0);
  transition:background .3s;
}
.count span{width:54px;height:54px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:600;font-size:20px}
.zikr.done{opacity:.5;border-color:var(--done)}
.zikr.done .count{background:var(--done)}
.zikr.done .count span{background:var(--done);color:var(--card);font-size:24px}
.zikr.bump .count span{animation:bump .18s}
@keyframes bump{50%{transform:scale(1.15)}}

.end{display:none;text-align:center;padding:36px 12px 10px}
.end.show{display:block}
.end p{font-family:"Amiri",serif;font-size:26px}
.end small{display:block;color:var(--soft);margin-top:6px;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <svg class="sky" viewBox="0 0 400 150" aria-hidden="true">
      <circle class="star" cx="60" cy="30" r="1.6"/><circle class="star" cx="330" cy="22" r="1.3"/>
      <circle class="star" cx="250" cy="45" r="1"/><circle class="star" cx="120" cy="60" r="1.2"/>
      <circle class="star" cx="370" cy="75" r="1"/>
      <path class="arc" d="M30 130 A170 110 0 0 1 370 130"/>
      <line class="ground" x1="10" y1="130" x2="390" y2="130"/>
      <circle class="glow" id="glow" cx="30" cy="130" r="22"/>
      <circle class="orb" id="orb" cx="30" cy="130" r="11"/>
    </svg>
    <h1 id="title">أذكار الصباح</h1>
    <p class="sub">اضغط على الذكر لتعدّه</p>
  </header>

  <div class="bar">
    <div class="tabs" role="group" aria-label="اختيار الأذكار">
      <button id="tM" aria-pressed="true">الصباح</button>
      <button id="tE" aria-pressed="false">المساء</button>
    </div>
    <div class="prog">
      <div class="track"><div class="fill" id="fill"></div></div>
      <span id="pct">0 / 0</span>
      <div class="tools">
        <button id="fDn" aria-label="تصغير الخط">أ-</button>
        <button id="fUp" aria-label="تكبير الخط">أ+</button>
        <button id="rst">إعادة</button>
      </div>
    </div>
  </div>

  <main class="list" id="list"></main>
  <div class="end" id="end"><p>تقبّل الله منك</p><small>أتممت الأذكار كاملة</small></div>
</div>

<script>
const A='أَعُوذُ بِاللهِ مِنْ الشَّيْطَانِ الرَّجِيمِ', B='بِسْمِ اللهِ الرَّحْمنِ الرَّحِيم';
const Z=(t,c,f,p)=>({t,c,f:f||'',p:p||''});
const kursi=Z('اللّهُ لاَ إِلَـهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ لاَ تَأْخُذُهُ سِنَةٌ وَلاَ نَوْمٌ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلاَّ بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلاَ يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلاَّ بِمَا شَاء وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالأَرْضَ وَلاَ يَؤُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ. <span class="ref">[آية الكرسي - البقرة 255]</span>',1,'من قالها حين يصبح أُجير من الجن حتى يمسي، ومن قالها حين يمسي أُجير من الجن حتى يصبح.',A);
const ikhlas=Z('قُلْ هُوَ ٱللَّهُ أَحَدٌ، ٱللَّهُ ٱلصَّمَدُ، لَمْ يَلِدْ وَلَمْ يُولَدْ، وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ.',3,'من قالها حين يصبح وحين يمسي كفته من كل شيء (الإخلاص والمعوذتين).',B);
const falaq=Z('قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ، مِن شَرِّ مَا خَلَقَ، وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ، وَمِن شَرِّ ٱلنَّفَّٰثَٰتِ فِى ٱلْعُقَدِ، وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ.',3,'',B);
const nas=Z('قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ، مَلِكِ ٱلنَّاسِ، إِلَٰهِ ٱلنَّاسِ، مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ، ٱلَّذِى يُوَسْوِسُ فِى صُدُورِ ٱلنَّاسِ، مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ.',3,'',B);
const sayyid=Z('اللّهـمَّ أَنْتَ رَبِّـي لا إلهَ إلاّ أَنْتَ، خَلَقْتَنـي وَأَنا عَبْـدُك، وَأَنا عَلـى عَهْـدِكَ وَوَعْـدِكَ ما اسْتَـطَعْـت، أَعـوذُ بِكَ مِنْ شَـرِّ ما صَنَـعْت، أَبـوءُ لَـكَ بِنِعْـمَتِـكَ عَلَـيَّ وَأَبـوءُ بِذَنْـبي فَاغْفـِرْ لي فَإِنَّـهُ لا يَغْـفِرُ الذُّنـوبَ إِلاّ أَنْتَ.',1,'من قالها موقنًا بها حين يمسي ومات من ليلته دخل الجنة، وكذلك حين يصبح.');
const radeet=Z('رَضيـتُ بِاللهِ رَبَّـاً وَبِالإسْلامِ ديـناً وَبِمُحَـمَّدٍ صلى الله عليه وسلم نَبِيّـاً.',3,'من قالها حين يصبح وحين يمسي كان حقًا على الله أن يرضيه يوم القيامة.');
const hasbi=Z('حَسْبِـيَ اللّهُ لا إلهَ إلاّ هُوَ عَلَـيهِ تَوَكَّـلتُ وَهُوَ رَبُّ العَرْشِ العَظـيم.',7,'من قالها كفاه الله ما أهمّه من أمر الدنيا والآخرة.');
const bism=Z('بِسـمِ اللهِ الذي لا يَضُـرُّ مَعَ اسمِـهِ شَيءٌ في الأرْضِ وَلا في السّمـاءِ وَهـوَ السّمـيعُ العَلـيم.',3,'لم يضرّه شيء.');
const subhanAdad=Z('سُبْحـانَ اللهِ وَبِحَمْـدِهِ عَدَدَ خَلْـقِه، وَرِضـا نَفْسِـه، وَزِنَـةَ عَـرْشِـه، وَمِـدادَ كَلِمـاتِـه.',3);
const afini=Z('اللّهُـمَّ عافِـني في بَدَنـي، اللّهُـمَّ عافِـني في سَمْـعي، اللّهُـمَّ عافِـني في بَصَـري، لا إلهَ إلاّ أَنْـتَ.',3);
const kufr=Z('اللّهُـمَّ إِنّـي أَعـوذُ بِكَ مِنَ الْكُـفر، وَالفَـقْر، وَأَعـوذُ بِكَ مِنْ عَذابِ القَـبْر، لا إلهَ إلاّ أَنْـتَ.',3);
const afw=Z('اللّهُـمَّ إِنِّـي أسْـأَلُـكَ العَـفْوَ وَالعـافِـيةَ في الدُّنْـيا وَالآخِـرَة، اللّهُـمَّ إِنِّـي أسْـأَلُـكَ العَـفْوَ وَالعـافِـيةَ في ديني وَدُنْـيايَ وَأهْـلي وَمالـي، اللّهُـمَّ اسْتُـرْ عـوْراتي وَآمِـنْ رَوْعاتـي، اللّهُـمَّ احْفَظْـني مِن بَـينِ يَدَيَّ وَمِن خَلْفـي وَعَن يَمـيني وَعَن شِمـالي، وَمِن فَوْقـي، وَأَعـوذُ بِعَظَمَـتِكَ أَن أُغْـتالَ مِن تَحْتـي.',1);
const hayy=Z('يَا حَيُّ يَا قيُّومُ بِرَحْمَتِكَ أسْتَغِيثُ أصْلِحْ لِي شَأنِي كُلَّهُ وَلاَ تَكِلْنِي إلَى نَفْسِي طَـرْفَةَ عَيْنٍ.',3);
const alim=Z('اللّهُـمَّ عالِـمَ الغَـيْبِ وَالشّـهادَةِ فاطِـرَ السّماواتِ وَالأرْضِ رَبَّ كـلِّ شَـيءٍ وَمَليـكَه، أَشْهَـدُ أَنْ لا إِلـهَ إِلاّ أَنْت، أَعـوذُ بِكَ مِن شَـرِّ نَفْسـي وَمِن شَـرِّ الشَّيْـطانِ وَشِرْكِهِ، وَأَنْ أَقْتَـرِفَ عَلـى نَفْسـي سوءاً أَوْ أَجُـرَّهُ إِلـى مُسْـلِم.',1);
const kalimat=Z('أَعـوذُ بِكَلِمـاتِ اللّهِ التّـامّـاتِ مِنْ شَـرِّ ما خَلَـق.',3);
const salat=Z('اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ على نَبِيِّنَا مُحمَّد.',10,'من صلّى عليّ حين يصبح وحين يمسي أدركته شفاعتي يوم القيامة.');
const shirk=Z('اللَّهُمَّ إِنَّا نَعُوذُ بِكَ مِنْ أَنْ نُشْرِكَ بِكَ شَيْئًا نَعْلَمُهُ، وَنَسْتَغْفِرُكَ لِمَا لَا نَعْلَمُهُ.',3);
const hamm=Z('اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ الْهَمِّ وَالْحَزَنِ، وَأَعُوذُ بِكَ مِنْ الْعَجْزِ وَالْكَسَلِ، وَأَعُوذُ بِكَ مِنْ الْجُبْنِ وَالْبُخْلِ، وَأَعُوذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ، وَقَهْرِ الرِّجَالِ.',3);
const istighfarAzim=Z('أسْتَغْفِرُ اللهَ العَظِيمَ الَّذِي لاَ إلَهَ إلاَّ هُوَ، الحَيُّ القَيُّومُ، وَأتُوبُ إلَيهِ.',3);
const yarab=Z('يَا رَبِّ، لَكَ الْحَمْدُ كَمَا يَنْبَغِي لِجَلَالِ وَجْهِكَ، وَلِعَظِيمِ سُلْطَانِكَ.',3);
const antaRabbi=Z('اللَّهُمَّ أَنْتَ رَبِّي لا إِلَهَ إِلا أَنْتَ، عَلَيْكَ تَوَكَّلْتُ، وَأَنْتَ رَبُّ الْعَرْشِ الْعَظِيمِ، مَا شَاءَ اللَّهُ كَانَ، وَمَا لَمْ يَشَأْ لَمْ يَكُنْ، وَلا حَوْلَ وَلا قُوَّةَ إِلا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ، أَعْلَمُ أَنَّ اللَّهَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، وَأَنَّ اللَّهَ قَدْ أَحَاطَ بِكُلِّ شَيْءٍ عِلْمًا، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ كُلِّ دَابَّةٍ أَنْتَ آخِذٌ بِنَاصِيَتِهَا، إِنَّ رَبِّي عَلَى صِرَاطٍ مُسْتَقِيمٍ.',1);
const tahlil=Z('لَا إلَه إلّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.',100,'كانت له عدل عشر رقاب، وكُتبت له مئة حسنة، ومُحيت عنه مئة سيئة، وكانت له حرزًا من الشيطان.');
const subhan=Z('سُبْحـانَ اللهِ وَبِحَمْـدِهِ.',100,'حُطّت خطاياه وإن كانت مثل زبد البحر.');

const $=id=>document.getElementById(id);
const list=$('list'), NAMES={m:'أذكار الصباح',e:'أذكار المساء'};
const clean=s=>s.replace(/ـ/g,'');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const store={
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let mode=(()=>{const h=new Date().getHours();return (h>=3&&h<14)?'m':'e'})();
let left=[];
let fs=store.get('azkar-fs')||26;
document.documentElement.style.setProperty('--fs',fs+'px');

function key(){return 'azkar-'+mode+'-'+today()}
function load(){
  const saved=store.get(key());
  left=(Array.isArray(saved)&&saved.length===DATA[mode].length)?saved:DATA[mode].map(z=>z.c);
}
function render(){
  document.body.classList.toggle('evening',mode==='e');
  const tc=getComputedStyle(document.body).getPropertyValue('--bg2').trim();
  if(tc)document.querySelector('meta[name="theme-color"]').setAttribute('content',tc);
  $('title').textContent=NAMES[mode];document.title=NAMES[mode];
  $('tM').setAttribute('aria-pressed',mode==='m');$('tE').setAttribute('aria-pressed',mode==='e');
  list.innerHTML='';
  DATA[mode].forEach((z,i)=>{
    const el=document.createElement('article');
    el.className='zikr';el.tabIndex=0;el.dataset.i=i;
    el.innerHTML=(z.p?`<div class="pre">${z.p}</div>`:'')+
      `<div class="txt">${clean(z.t)}</div>`+
      (z.f?`<div class="fadl">${z.f}</div>`:'')+
      `<div class="foot"><div class="count"><span></span></div></div>`;
    el.addEventListener('click',()=>tap(i));
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(i)}});
    list.appendChild(el);
    paint(i);
  });
  progress();
}
function paint(i){
  const el=list.children[i], z=DATA[mode][i], n=left[i];
  el.classList.toggle('done',n===0);
  el.querySelector('.count').style.setProperty('--p',(z.c-n)/z.c);
  el.querySelector('.count span').textContent=n===0?'✓':n;
  el.setAttribute('aria-label','المتبقي '+n);
}
function progress(){
  const total=DATA[mode].length, done=left.filter(n=>n===0).length;
  $('fill').style.width=(done/total*100)+'%';
  $('pct').textContent=done+' / '+total;
  $('end').classList.toggle('show',done===total);
  // orb travels along the arc
  const t=done/total, ang=Math.PI*(1-t), cx=200+170*Math.cos(ang), cy=130-110*Math.sin(ang);
  ['orb','glow'].forEach(id=>{$(id).setAttribute('cx',cx.toFixed(1));$(id).setAttribute('cy',cy.toFixed(1))});
}
function tap(i){
  if(left[i]===0)return;
  left[i]--;store.set(key(),left);
  const el=list.children[i];
  el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');
  try{navigator.vibrate&&navigator.vibrate(left[i]===0?[30,40,30]:12)}catch(e){}
  paint(i);progress();
  if(left[i]===0){
    const next=left.findIndex((n,j)=>j>i&&n>0);
    if(next>-1)setTimeout(()=>list.children[next].scrollIntoView({behavior:'smooth',block:'start'}),350);
    else if(left.every(n=>n===0))setTimeout(()=>$('end').scrollIntoView({behavior:'smooth',block:'center'}),350);
  }
}
function setMode(m){if(m===mode)return;mode=m;load();render();window.scrollTo({top:0,behavior:'smooth'})}
$('tM').onclick=()=>setMode('m');$('tE').onclick=()=>setMode('e');
$('rst').onclick=()=>{if(confirm('إعادة العدّ من البداية؟')){left=DATA[mode].map(z=>z.c);store.set(key(),left);render();window.scrollTo({top:0,behavior:'smooth'})}};
function font(d){fs=Math.min(40,Math.max(18,fs+d));document.documentElement.style.setProperty('--fs',fs+'px');store.set('azkar-fs',fs)}
$('fUp').onclick=()=>font(2);$('fDn').onclick=()=>font(-2);

load();render();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
</script>
